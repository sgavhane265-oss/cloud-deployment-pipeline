name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests
      - name: Run tests
        run: npm test

      # 5. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} \
            .

      # 7. Push Docker image to GHCR
      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # 8. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::429877856333:role/GitHubActionsDeploymentRole
          aws-region: ap-southeast-2

      # 9. Verify AWS authentication
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 10. Send deployment command to EC2 through SSM
      - name: Deploy to EC2
        id: deploy
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-056b0b73075c3318e" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cloud application" \
            --parameters "commands=[
              \"docker pull $IMAGE\",
              \"docker stop cloud-app || true\",
              \"docker rm cloud-app || true\",
              \"docker run -d --name cloud-app -p 3000:3000 $IMAGE\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # 11. Wait for deployment to finish
      - name: Wait for deployment
        env:
          INSTANCE_ID: i-056b0b73075c3318e
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          echo "Waiting for deployment..."
          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
